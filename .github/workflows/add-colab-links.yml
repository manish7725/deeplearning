name: Build the blog learning units

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate rich notebooks
        run: python scripts/enrich_notebooks.py

      - name: Merge labs into notebooks and remove obsolete labs
        run: python scripts/merge_labs_into_notebooks.py

      - name: Normalize all blog notebook navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          repo = 'manish7725/deeplearning'
          branch = 'main'
          marker = '<!-- NOTEBOOK-LAB-NAV -->'
          colab_pattern = re.compile(r'>\s*🧪\s*\*\*\[Run this code in Google Colab\]\([^\n]+\)\*\*\s*\n?', re.MULTILINE)
          lab_pattern = re.compile(r'^.*\]\([^\n]*?/labs/[^\n]*\)\s*\n?', re.MULTILINE)
          feature_colab_pattern = re.compile(r'https://colab\.research\.google\.com/github/manish7725/deeplearning/blob/feature/01-deeplearning-syllabus/[^)]+')

          for path in sorted(Path('blogs').glob('*.md')):
              match = re.match(r'^(\d{2})-', path.name)
              if not match:
                  continue
              prefix = match.group(1)
              notebooks = sorted(Path('notebooks').glob(f'{prefix}-*.ipynb'))
              if not notebooks:
                  continue
              notebook = notebooks[0]
              notebook_url = f'https://github.com/{repo}/blob/{branch}/{notebook.as_posix()}'
              colab_url = f'https://colab.research.google.com/github/{repo}/blob/{branch}/{notebook.as_posix()}'

              text = path.read_text(encoding='utf-8')
              text = colab_pattern.sub('', text)
              text = feature_colab_pattern.sub('', text)
              text = lab_pattern.sub('', text)

              nav = (
                  f'{marker}\n\n'
                  '## 🧪 Interactive Lab\n\n'
                  'The matching notebook is the complete hands-on laboratory for this lesson. '
                  'It contains the runnable code, experiments, visualizations, and challenges.\n\n'
                  f'**[📓 Open the notebook on GitHub]({notebook_url})**  '
                  f'· **[▶ Open the notebook in Google Colab]({colab_url})**\n\n'
              )

              if marker in text:
                  start = text.index(marker)
                  rest = text[start:]
                  next_heading = re.search(r'(?m)^## (?!🧪 Interactive Lab)', rest)
                  suffix = rest[next_heading.start():] if next_heading else ''
                  text = text[:start] + nav + suffix
              else:
                  lines = text.splitlines(True)
                  insert_at = 1 if lines and lines[0].lstrip().startswith('#') else 0
                  text = ''.join(lines[:insert_at]) + '\n' + nav + ''.join(lines[insert_at:])

              text = re.sub(r'\n{4,}', '\n\n\n', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate blog learning quality invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          errors = []

          for path in sorted(Path('blogs').glob('*.md')):
              text = path.read_text(encoding='utf-8')
              prefix = path.name[:2]

              if text.count('<!-- NOTEBOOK-LAB-NAV -->') != 1:
                  errors.append(f'{path}: expected exactly one navigation marker')
              if '/labs/' in text:
                  errors.append(f'{path}: stale labs link remains')
              if 'feature/01-deeplearning-syllabus' in text:
                  errors.append(f'{path}: stale feature-branch link remains')
              if 'cite' in text or 'turn0' in text or 'turn1' in text:
                  errors.append(f'{path}: ChatGPT-internal citation marker remains')

              colab_links = re.findall(r'https://colab\.research\.google\.com/github/manish7725/deeplearning/blob/main/notebooks/[^)]+', text)
              if len(colab_links) != 1:
                  errors.append(f'{path}: expected exactly one main Colab link, found {len(colab_links)}')

              blog_titles = re.findall(r'^# Blog \d{2} — ', text, flags=re.MULTILINE)
              if len(blog_titles) != 1:
                  errors.append(f'{path}: expected exactly one top-level Blog title, found {len(blog_titles)}')

              expected_title = re.compile(rf'^# Blog {re.escape(prefix)} — ', re.MULTILINE)
              if not expected_title.search(text):
                  errors.append(f'{path}: missing expected Blog {prefix} title')

          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print('All blog posts satisfy navigation, title, and external-reference quality invariants.')
          PY

      - name: Commit reorganized learning units
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks blogs labs scripts .github/workflows/add-colab-links.yml
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Validate blog learning quality invariants'
          git push origin HEAD:main
