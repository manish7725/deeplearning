name: Build the blog learning units

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate rich notebooks
        run: python scripts/enrich_notebooks.py

      - name: Add topic-specific laboratory experiments
        run: python scripts/upgrade_notebooks.py

      - name: Apply Class 8 student walkthrough fixes
        run: python scripts/student_walkthrough_fixes.py

      - name: Merge labs into notebooks and remove obsolete labs
        run: python scripts/merge_labs_into_notebooks.py

      - name: Normalize all blog notebook navigation and content hygiene
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          repo = 'manish7725/deeplearning'
          branch = 'main'
          marker = '<!-- NOTEBOOK-LAB-NAV -->'

          for path in sorted(Path('blogs').glob('*.md')):
              match = re.match(r'^(\d{2})-', path.name)
              if not match:
                  continue
              prefix = match.group(1)
              notebooks = sorted(Path('notebooks').glob(f'{prefix}-*.ipynb'))
              if not notebooks:
                  continue
              notebook = notebooks[0]
              notebook_url = f'https://github.com/{repo}/blob/{branch}/{notebook.as_posix()}'
              colab_url = f'https://colab.research.google.com/github/{repo}/blob/{branch}/{notebook.as_posix()}'
              text = path.read_text(encoding='utf-8')

              text = re.sub(r'>\s*🧪\s*\*\*\[Run this code in Google Colab\]\([^\n]+\)\*\*\s*\n?', '', text)
              text = re.sub(r'https://colab\.research\.google\.com/github/manish7725/deeplearning/blob/feature/01-deeplearning-syllabus/[^)]+', '', text)
              text = re.sub(r'^.*\]\([^\n]*?/labs/[^\n]*\)\s*\n?', '', text, flags=re.MULTILINE)
              embedded = re.search(r'(?m)^# Blog (?!' + re.escape(prefix) + r' —)\d{2} — ', text)
              if embedded:
                  text = text[:embedded.start()].rstrip() + '\n'
              text = re.sub(r'\s*(?:cite|url|entity|memcite)[^\n]*', '', text)

              nav = (
                  f'{marker}\n\n'
                  '## 🧪 Interactive Lab\n\n'
                  'The matching notebook is the complete hands-on laboratory for this lesson. It contains the runnable code, experiments, visualizations, and challenges.\n\n'
                  f'**[📓 Open the notebook on GitHub]({notebook_url})**  '
                  f'· **[▶ Open the notebook in Google Colab]({colab_url})**\n\n'
              )
              # Remove only the generated navigation block. Do not consume the
              # student lesson bridge that follows it.
              text = re.sub(r'<!-- NOTEBOOK-LAB-NAV -->\n\n## 🧪 Interactive Lab\n\n.*?\n\n\*\*\[▶ Open the notebook in Google Colab\]\([^\n]+\)\*\*\n*', '', text, flags=re.DOTALL)
              lines = text.splitlines(True)
              insert_at = 1 if lines and lines[0].lstrip().startswith('#') else 0
              text = ''.join(lines[:insert_at]) + '\n' + nav + ''.join(lines[insert_at:])
              text = re.sub(r'\n{4,}', '\n\n\n', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate all 37 learning units
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          errors=[]
          blogs=sorted(Path('blogs').glob('*.md'))
          notebooks=sorted(Path('notebooks').glob('*.ipynb'))
          if len(blogs) != 37: errors.append(f'expected 37 blogs, found {len(blogs)}')
          if len(notebooks) != 37: errors.append(f'expected 37 notebooks, found {len(notebooks)}')
          all_blogs = {p.name[:2]: p for p in blogs}
          for path in blogs:
              text=path.read_text(encoding='utf-8'); prefix=path.name[:2]
              if text.count('<!-- NOTEBOOK-LAB-NAV -->') != 1: errors.append(f'{path}: navigation marker count != 1')
              if '/labs/' in text: errors.append(f'{path}: stale labs reference')
              if 'feature/01-deeplearning-syllabus' in text: errors.append(f'{path}: stale feature branch reference')
              if re.search(r'(?:cite|url|entity|memcite)',text): errors.append(f'{path}: ChatGPT transport marker remains')
              if len(re.findall(r'https://colab\.research\.google\.com/github/manish7725/deeplearning/blob/main/notebooks/[^)]+',text)) != 1: errors.append(f'{path}: Colab link count != 1')
              titles=re.findall(r'^# Blog \d{2} — ',text,re.M)
              if len(titles)!=1: errors.append(f'{path}: top-level blog title count != 1')
              if not re.search(rf'^# Blog {re.escape(prefix)} — ',text,re.M): errors.append(f'{path}: wrong/missing blog number')
              if re.search(r'(?m)^# Blog \d{2} — ',text[text.find('\n')+1:]): errors.append(f'{path}: embedded second blog detected')
              if '## 🧭 Where this lesson fits' not in text: errors.append(f'{path}: missing lesson bridge')
              if path.name.startswith('03-') and 'print(2*10 + 3*20)' in text: errors.append(f'{path}: malformed old verification section remains')
          for path in notebooks:
              try: nb=json.loads(path.read_text(encoding='utf-8'))
              except Exception as e: errors.append(f'{path}: invalid JSON: {e}'); continue
              cells=nb.get('cells',[])
              markdown='\n'.join(''.join(c.get('source',[])) for c in cells if c.get('cell_type')=='markdown')
              if not any(c.get('cell_type')=='code' for c in cells): errors.append(f'{path}: no code cells')
              if 'Where this lesson fits' not in markdown: errors.append(f'{path}: missing lesson bridge')
              if 'Topic experiment' not in markdown: errors.append(f'{path}: missing topic-specific experiment')
              prefix=path.name[:2]
              if prefix in all_blogs and all_blogs[prefix].name not in markdown: errors.append(f'{path}: matching blog link missing')
          if errors:
              print('\n'.join(errors)); raise SystemExit(1)
          print('37 blogs and 37 notebooks passed the Class 8 student-walkthrough quality checks.')
          PY

      - name: Commit quality fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks blogs labs scripts .github/workflows/add-colab-links.yml
          if git diff --cached --quiet; then echo 'No generated changes.'; exit 0; fi
          git commit -m 'Fix Class 8 learning path coherence'
          git push origin HEAD:main
