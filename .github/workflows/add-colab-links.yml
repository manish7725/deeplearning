name: Class 8 to PhD Curriculum Builder

on:
  push:
    branches:
      - reorg/class8-to-phd-curriculum
  pull_request:
    branches:
      - main
    paths:
      - 'blogs/**'
      - 'notebooks/**'
      - 'SYLLABUS.md'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: class8-to-phd-curriculum
  cancel-in-progress: false

jobs:
  quality-and-curation:
    if: github.ref_name == 'reorg/class8-to-phd-curriculum' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental curriculum branch
        uses: actions/checkout@v4
        with:
          ref: reorg/class8-to-phd-curriculum
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade short chapter blogs
        run: python scripts/upgrade_blogs.py

      - name: Run Class 8 walkthrough fixes
        run: python scripts/student_walkthrough_fixes.py

      - name: Add chapter-specific experiments
        run: python scripts/upgrade_notebooks.py

      - name: Add beginner-friendly code explanations
        run: python scripts/upgrade_notebook_tutorials.py

      - name: Add visualization and animation guidance
        run: python scripts/enrich_notebooks.py

      - name: Normalize experimental-branch navigation
        shell: bash
        run: |
          find blogs notebooks README.md SYLLABUS.md -type f -print0 2>/dev/null | xargs -0 sed -i 's#github.com/manish7725/deeplearning/blob/main/#github.com/manish7725/deeplearning/blob/reorg/class8-to-phd-curriculum/#g'
          find blogs notebooks README.md SYLLABUS.md -type f -print0 2>/dev/null | xargs -0 sed -i 's#colab.research.google.com/github/manish7725/deeplearning/blob/main/#colab.research.google.com/github/manish7725/deeplearning/blob/reorg/class8-to-phd-curriculum/#g'

      - name: Validate curriculum structure
        run: python scripts/curriculum_quality.py

      - name: Verify no workflow can push to main
        shell: bash
        run: |
          if grep -R -n -E 'git push origin .*:main|git push .* main$|HEAD:main' .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'Found a workflow that can write to main. Review required.'
            exit 1
          fi

      - name: Verify experimental branch links
        shell: bash
        run: |
          if grep -R "feature/01-deeplearning-syllabus\|feature/02-class8-to-phd-learning" blogs notebooks README.md SYLLABUS.md 2>/dev/null; then
            echo 'Found stale experimental branch references.'
            exit 1
          fi
          if grep -R "/blob/main/notebooks/\|/blob/main/blogs/" blogs notebooks README.md SYLLABUS.md 2>/dev/null; then
            echo 'Found main-branch navigation links inside the experimental curriculum.'
            exit 1
          fi

      - name: Commit generated curriculum changes on experimental branch only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blogs notebooks CURRICULUM_QUALITY.md
          if git diff --cached --quiet; then
            echo 'No generated curriculum changes.'
            exit 0
          fi
          git commit -m 'Complete Class 8 to PhD chapter curriculum'
          git push origin HEAD:reorg/class8-to-phd-curriculum
