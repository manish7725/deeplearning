name: Build the blog learning units

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate rich notebooks
        run: python scripts/enrich_notebooks.py

      - name: Merge labs into notebooks and remove obsolete labs
        run: python scripts/merge_labs_into_notebooks.py

      - name: Add notebook and Colab links to blogs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          repo = 'manish7725/deeplearning'
          branch = 'main'
          marker = '<!-- NOTEBOOK-LAB-NAV -->'

          for path in sorted(Path('blogs').glob('*.md')):
              match = re.match(r'^(\d{2})-', path.name)
              if not match:
                  continue
              prefix = match.group(1)
              notebooks = sorted(Path('notebooks').glob(f'{prefix}-*.ipynb'))
              if not notebooks:
                  continue
              notebook = notebooks[0]
              notebook_url = f'https://github.com/{repo}/blob/{branch}/{notebook.as_posix()}'
              colab_url = f'https://colab.research.google.com/github/{repo}/blob/{branch}/{notebook.as_posix()}'

              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'^> 🧪 \*\*\[Run this code in Google Colab\]\([^\n]+\)\*\*\n\n',
                  '', text, flags=re.MULTILINE
              )

              nav = (
                  f'{marker}\n\n'
                  '## 🧪 Interactive Lab\n\n'
                  'The explanation and the hands-on experiment now live together: '
                  'the notebook contains the complete runnable lab for this lesson.\n\n'
                  f'**[📓 Open the notebook on GitHub]({notebook_url})**  '
                  f'· **[▶ Open the notebook in Google Colab]({colab_url})**\n\n'
                  'Run the cells, change the values, observe the result, and then return '
                  'to this blog to connect the experiment back to the idea.\n\n'
              )

              if marker in text:
                  start = text.index(marker)
                  rest = text[start:]
                  next_heading = re.search(r'(?m)^## (?!🧪 Interactive Lab)', rest)
                  if next_heading:
                      suffix = rest[next_heading.start():]
                  else:
                      suffix = ''
                  text = text[:start] + nav + suffix
              else:
                  lines = text.splitlines(True)
                  insert_at = 1 if lines and lines[0].lstrip().startswith('#') else 0
                  text = ''.join(lines[:insert_at]) + '\n' + nav + ''.join(lines[insert_at:])

              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit reorganized learning units
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks blogs labs scripts .github/workflows/add-colab-links.yml
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Merge labs into notebooks and simplify blog navigation'
          git push origin HEAD:main
