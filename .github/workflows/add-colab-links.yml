name: Class 8 to PhD Curriculum Builder

on:
  push:
    branches:
      - reorg/class8-to-phd-curriculum
  pull_request:
    branches:
      - main
    paths:
      - 'blogs/**'
      - 'notebooks/**'
      - 'SYLLABUS.md'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: class8-to-phd-curriculum
  cancel-in-progress: false

jobs:
  quality-and-curation:
    if: github.ref_name == 'reorg/class8-to-phd-curriculum' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental curriculum branch
        uses: actions/checkout@v4
        with:
          ref: reorg/class8-to-phd-curriculum
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate curriculum structure
        run: python scripts/curriculum_quality.py

      - name: Verify no main-targeted automation remains
        shell: bash
        run: |
          if grep -R "HEAD:main\|ref: main\|branches:[[:space:]]*$" .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'Found workflow references that can target main. Review required.'
            exit 1
          fi

      - name: Verify experimental branch links
        shell: bash
        run: |
          if grep -R "feature/01-deeplearning-syllabus\|feature/02-class8-to-phd-learning" blogs notebooks README.md SYLLABUS.md 2>/dev/null; then
            echo 'Found stale experimental branch references.'
            exit 1
          fi
          if grep -R "/blob/main/notebooks/\|/blob/main/blogs/" blogs notebooks README.md SYLLABUS.md 2>/dev/null; then
            echo 'Found main-branch navigation links inside the experimental curriculum.'
            exit 1
          fi

      - name: Commit generated quality report on curriculum branch only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRICULUM_QUALITY.md
          if git diff --cached --quiet; then
            echo 'No generated report changes.'
            exit 0
          fi
          git commit -m 'Update curriculum quality report'
          git push origin HEAD:reorg/class8-to-phd-curriculum
